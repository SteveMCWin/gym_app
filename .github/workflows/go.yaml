# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.4'

    - name: Install SQLite and build spellfix extension
      run: |
        mkdir extensions
        sudo apt-get update
        sudo apt-get install -y sqlite3 libsqlite3-dev build-essential curl
        curl -L https://raw.githubusercontent.com/sqlite/sqlite/version-3.46.0/ext/misc/spellfix.c -o spellfix.c
        gcc -shared -fPIC -I/usr/include -o extensions/spellfix.so spellfix.c -lsqlite3
        rm spellfix.c

    - name: Build
      run: go build -v 

    - name: Test
      run: go test -v ./...
      env:
        CI: true
        DOMAIN: ${{ secrets.DOMAIN }}
        CSRF_KEY: ${{ secrets.CSRF_KEY }}
        MAIL_SENDER: ${{ secrets.MAIL_SENDER}}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS}}
